#Kotlin
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768M -XX:MaxMetaspaceSize=256M -XX:+UseSerialGC -XX:TieredStopAtLevel=1
kotlin.mpp.commonizerJvmArgs=-Xmx768M -XX:MaxMetaspaceSize=256M -XX:+UseSerialGC -XX:TieredStopAtLevel=1

#Gradle
org.gradle.jvmargs=-Xmx1024M -XX:MaxMetaspaceSize=256M -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false